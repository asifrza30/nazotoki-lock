<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="wp-singular page-template page-template-page-lp page-template-page-lp-php page wp-embed-responsive wp-theme-gensen_tcd050 wp-child-theme-riddletimez page-lock" style="background-color: #FFF;">
<div class="post_blanche">

<div class="lock" id="lock">
  <div class="lock-bg" aria-hidden="true"></div>
  <div class="lock-sheet">
    <div class="lock-deco" aria-hidden="true">
      <img class="lock-deco-item is-lamp-left"  src="assets/img/deco/lamp-left.webp"  alt="" width="244" height="402">
      <img class="lock-deco-item is-lamp-right" src="assets/img/deco/lamp-right.webp" alt="" width="244" height="402">
      <img class="lock-deco-item is-key"        src="assets/img/deco/key.webp"        alt="" width="130" height="208">
      <img class="lock-deco-item is-scissors"   src="assets/img/deco/scissors.webp"   alt="" width="164" height="337">
      <img class="lock-deco-item is-seal"       src="assets/img/deco/seal.webp"       alt="" width="243" height="216">
      <img class="lock-deco-item is-quill"      src="assets/img/deco/quill.webp"      alt="" width="250" height="285">
      <img class="lock-deco-item is-suitcase"   src="assets/img/deco/suitcase.webp"   alt="" width="500" height="314">
      <img class="lock-deco-item is-hand"       src="assets/img/deco/hand.webp"       alt="" width="258" height="217">
      <img class="lock-deco-item is-camera"     src="assets/img/deco/camera.webp"     alt="" width="316" height="268">
      <img class="lock-deco-item is-teacup"     src="assets/img/deco/teacup.webp"     alt="" width="256" height="215">
    </div>

    <div class="lock-titlebar lock-reveal">
      <img class="lock-frame" src="assets/img/frame.svg" alt="" width="301" height="57">
      <h1 class="lock-title">解答欄を見つけた</h1>
    </div>

    <p class="lock-sub lock-reveal">ひらがなで入力すること</p>

    <form class="lock-form lock-reveal" id="lock-form" novalidate>
      <ol class="lock-fields">
        <li class="lock-field">
          <label class="lock-label" for="a1">こたえ</label>
          <input class="lock-input" id="a1" name="a1" type="text" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" enterkeyhint="next">
        </li>
        <li class="lock-field">

        </li>
        <li class="lock-field">

          <input class="lock-input" id="a6" name="a6" type="text" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" enterkeyhint="next">
        </li>
        <li class="lock-field">
          <label class="lock-label" for="a7">こたえ</label>
          <input class="lock-input" id="a7" name="a7" type="text" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" enterkeyhint="next">
        </li>
        <li class="lock-field">
          <label class="lock-label" for="a8">こたえ</label>

        </li>
        <li class="lock-field">
          <label class="lock-label" for="a10">こたえ</label>
          <input class="lock-input" id="a10" name="a10" type="text" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="16" enterkeyhint="done">
        </li>
      </ol>
      <button class="lock-submit" type="submit">送信</button>
    </form>
  </div>

  <div class="lock-modal" id="lock-modal" role="dialog" aria-modal="true" aria-labelledby="lock-modal-title" hidden>
    <div class="lock-modal-backdrop" data-close></div>
    <div class="lock-modal-panel">
      <div class="lock-titlebar">
        <img class="lock-frame" src="assets/img/frame.svg" alt="" width="301" height="57">
        <p class="lock-title" id="lock-modal-title">Incorrect！</p>
      </div>
      <p class="lock-modal-line">正しくこたえを入力できていないようです。</p>
      <p class="lock-modal-line">10個のこたえが間違いないか？</p>
      <p class="lock-modal-line">入力の順番に間違いがないか？</p>
      <p class="lock-modal-line">もう一度考えて入力してください！</p>
      <button class="lock-submit lock-modal-close" type="button" data-close>閉じる</button>
    </div>
  </div>
</div>

</div>
<script src="assets/js/lock.js"></script>
